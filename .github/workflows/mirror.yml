name: mirror

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: mirror

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the channel archive
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --max-time 60 -H 'Accept-Encoding: gzip' -D headers -o descriptors.json.gz \
            https://canalpeer.com/api/descriptors
          grep -qi '^content-encoding: gzip' headers
          new=$(gzip -dc descriptors.json.gz | jq '[.items[].seq] | max // 0')
          old=$(curl -fsS "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mirror/descriptors.json.gz" \
            | gzip -dc | jq '[.items[].seq] | max // 0' || echo 0)
          echo "site=$new mirror=$old"
          # Never roll the mirror back, and skip a push when nothing changed.
          if [ "$new" -gt "$old" ]; then echo "publish=1" >> "$GITHUB_ENV"; fi
      - name: Publish as a single commit
        if: env.publish == '1'
        run: |
          set -euo pipefail
          mkdir out && mv descriptors.json.gz out/ && cd out
          git init -q -b mirror
          git add descriptors.json.gz
          git -c user.name=canalpeer -c user.email=canalpeer@users.noreply.github.com commit -q -m "Channel archive"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" mirror

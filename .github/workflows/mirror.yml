name: mirror

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: mirror

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the channel archive
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --max-time 60 -H 'Accept-Encoding: gzip' -D headers -o descriptors.json.gz \
            https://canalpeer.com/api/descriptors
          grep -qi '^content-encoding: gzip' headers
          new=$(gzip -dc descriptors.json.gz | jq '[.items[].seq] | max // 0')
          old=$(curl -fsS "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mirror/seq.txt" || echo 0)
          echo "site=$new mirror=$old"
          # Never roll the mirror back, and skip a push when nothing changed.
          if [ "$new" -gt "$old" ]; then echo "publish=1" >> "$GITHUB_ENV"; fi
      - name: Publish as a single commit
        if: env.publish == '1'
        env:
          MIRROR_KEY: ${{ secrets.MIRROR_KEY }}
        run: |
          set -euo pipefail
          mkdir out
          go run tools/seal.go < descriptors.json.gz > out/data.bin
          gzip -dc descriptors.json.gz | jq '[.items[].seq] | max // 0' > out/seq.txt
          cd out
          git init -q -b mirror
          git add data.bin seq.txt
          git -c user.name=canalpeer -c user.email=canalpeer@users.noreply.github.com commit -q -m "Data"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" mirror
